<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Add Prescription</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #f4f8fb 100%);
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e1e8f0;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-top: 0;
            font-size: 24px;
        }

        .doctor-badge {
            background: #eff6ff;
            border-left: 4px solid #0d6efd;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13.5px;
            color: #1e3a8a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 13px;
            box-sizing: border-box;
            border: 1.5px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.25);
            transition: background 0.2s;
        }

        button:hover {
            background: #0b5ed7;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            text-decoration: none;
            color: #0d6efd;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Issue New Prescription</h2>

    <div class="doctor-badge">
        <span>Prescribing Doctor:</span>
        <strong th:text="${doctorName}">Doctor</strong>
    </div>

    <form th:action="@{/add-prescription}"
          th:object="${prescription}"
          method="post">

        <!-- Hidden Doctor ID -->
        <input type="hidden" th:field="*{doctorId}">

        <!-- Select Patient Dropdown -->
        <div class="form-group">
            <label for="patientSelect">Select Patient</label>
            <select th:field="*{patientId}" id="patientSelect" required>
                <option value="">-- Choose Patient --</option>
                <option th:each="patient : ${patients}"
                        th:value="${patient.id}"
                        th:text="${patient.name + ' (' + patient.email + ') - ID #' + patient.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="medicineName">Medicine Name</label>
            <input type="text"
                   th:field="*{medicineName}"
                   id="medicineName"
                   placeholder="e.g. Amoxicillin 500mg, Paracetamol 650mg, Metformin..."
                   required>
        </div>

        <div class="form-group">
            <label for="dosage">Dosage Instructions</label>
            <input type="text"
                   th:field="*{dosage}"
                   id="dosage"
                   placeholder="e.g. 1 tablet twice a day after meals"
                   required>
        </div>

        <div class="form-group">
            <label for="duration">Duration</label>
            <input type="text"
                   th:field="*{duration}"
                   id="duration"
                   placeholder="e.g. 5 days, 2 weeks, 1 month"
                   required>
        </div>

        <div class="form-group">
            <label for="instructions">Additional Instructions</label>
            <textarea th:field="*{instructions}"
                      id="instructions"
                      placeholder="e.g. Drink plenty of water, avoid taking on an empty stomach..."></textarea>
        </div>

        <button type="submit">
            Save & Issue Prescription
        </button>

    </form>

    <a th:href="${dashboardUrl}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
