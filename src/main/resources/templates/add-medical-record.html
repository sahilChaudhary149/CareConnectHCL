<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Add Medical Record</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #f4f8fb 100%);
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e1e8f0;
        }

        h1 {
            color: #1565c0;
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        .doctor-badge {
            background: #eff6ff;
            border-left: 4px solid #1976d2;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13.5px;
            color: #1e3a8a;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 13px;
            box-sizing: border-box;
            border: 1.5px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15.5px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.25);
            transition: background 0.2s;
        }

        button:hover {
            background: #1565c0;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            text-decoration: none;
            color: #1976d2;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Medical Record</h1>

    <form action="/add-medical-record" method="post" th:object="${medicalRecord}">

        <!-- When Doctor is logged in -->
        <div th:if="${isDoctor}" class="doctor-badge">
            <span>Attending Doctor:</span>
            <strong th:text="${doctorName}">Doctor</strong>
            <input type="hidden" th:field="*{doctorId}">
        </div>

        <!-- When Admin is logged in: Select Doctor from dropdown -->
        <div th:if="${!isDoctor}" class="form-group">
            <label for="doctorSelect">Attending Doctor</label>
            <select th:field="*{doctorId}" id="doctorSelect" required>
                <option value="">-- Choose Attending Doctor --</option>
                <option th:each="doc : ${doctors}"
                        th:value="${doc.id}"
                        th:text="${doc.name + (doc.specialization != null ? ' (' + doc.specialization + ')' : '')}">
                </option>
            </select>
        </div>

        <!-- Patient Selection Dropdown -->
        <div class="form-group">
            <label for="patientSelect">Select Patient</label>
            <select th:field="*{patientId}" id="patientSelect" required>
                <option value="">-- Choose Patient --</option>
                <option th:each="patient : ${patients}"
                        th:value="${patient.id}"
                        th:text="${patient.name + ' (' + patient.email + ') - ID #' + patient.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="diagnosis">Clinical Diagnosis</label>
            <input type="text"
                   th:field="*{diagnosis}"
                   id="diagnosis"
                   placeholder="e.g. Acute Bronchitis, Type 2 Diabetes, Hypertension..."
                   required>
        </div>

        <div class="form-group">
            <label for="clinicalNotes">Clinical Notes & Observations</label>
            <textarea th:field="*{clinicalNotes}"
                      id="clinicalNotes"
                      placeholder="Enter detailed clinical findings, symptoms, and treatment plan..."
                      required></textarea>
        </div>

        <button type="submit">
            Save Medical Record
        </button>

    </form>

    <a th:href="${dashboardUrl}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
