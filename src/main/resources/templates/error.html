<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Something Went Wrong</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #f4f8fb 100%);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(25, 118, 210, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
            padding: 40px 32px;
            border: 1px solid #e1e8f0;
            text-align: center;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            color: #0d47a1;
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 700;
        }

        p {
            color: #64748b;
            font-size: 14.5px;
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1976d2;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1565c0;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">⚕️</div>
    <h1>Notice</h1>
    <p th:text="${message != null ? message : 'An unexpected request error occurred. Please return to the homepage or try again.'}">
        An unexpected request error occurred.
    </p>

    <div class="action-btns">
        <a href="/login" class="btn btn-primary">Go to Login</a>
        <a href="/" class="btn btn-secondary">Homepage</a>
    </div>
</div>

</body>
</html>
