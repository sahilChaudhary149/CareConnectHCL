<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Electronic Health Record</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #f4f8fb 100%);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: white;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(25, 118, 210, 0.12);
            border: 1px solid #e1e8f0;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 50%;
            font-size: 32px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.15);
        }

        h1 {
            color: #0d47a1;
            font-size: 36px;
            margin: 0 0 8px;
            font-weight: 700;
        }

        h2 {
            color: #475569;
            font-size: 20px;
            font-weight: 500;
            margin: 0 0 16px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 auto 30px;
            max-width: 520px;
        }

        .role-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .role-btn {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 10px;
            text-decoration: none;
            color: #334155;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .role-btn .icon {
            font-size: 26px;
        }

        .role-btn .title {
            font-weight: 600;
            font-size: 14px;
        }

        .role-btn:hover {
            border-color: #1976d2;
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(25, 118, 210, 0.12);
            color: #0d47a1;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-primary {
            background: #1976d2;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.2);
        }

        .btn-primary:hover {
            background: #1565c0;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand-badge">⚕</div>

    <h1>CareConnect</h1>

    <h2>Patient-Provider EHR System</h2>

    <p>
        A comprehensive Electronic Health Record portal for managing patient records,
        appointments, clinical documentation, and prescriptions.
    </p>

    <!-- Direct Dashboard Portals -->
    <div class="role-cards">
        <a href="/login?role=PATIENT" class="role-btn">
            <span class="icon">🩺</span>
            <span class="title">Patient Portal</span>
        </a>

        <a href="/login?role=DOCTOR" class="role-btn">
            <span class="icon">👨‍⚕️</span>
            <span class="title">Doctor Portal</span>
        </a>

        <a href="/login?role=ADMIN" class="role-btn">
            <span class="icon">🛡️</span>
            <span class="title">Admin Portal</span>
        </a>
    </div>

    <div class="action-row">
        <a href="/login" class="btn-primary">
            Sign In
        </a>

        <a href="/register" class="btn-secondary">
            Register Account
        </a>
    </div>

</div>

</body>

</html>
